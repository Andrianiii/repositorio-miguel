<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    

    <title>Show Móveis São José</title>
</head>

<body>

    <div class="Home">

        <div class="logo">
            <img src="imagens/logo.png" alt="logo">
        </div>

        <div class="background">
            <img src="imagens/backgroud.png">
        </div>

        <div class="forms">
            <form>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" class="form-control" required>


                <label for="email">Digite seu E-mail:</label>
                <input type="email" id="email" name="email" class="form-control" required>


                <label for="data_nasc">Data de nascimento:</label>
                <input type="date" id="data_nasc" name="data_nasc" class="form-control" required>

                <label for="sexo">Sexo:</label>
                <select id="sexo" name="sexo" class="form-control" required>

                    <option value="">Selecione uma opção</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="outro">Outro</option>
                </select>

                <label for="celular">Digite seu número do Whatsapp: </label>
                <input type="tel" id="celular" name="celular" class="form-control" required>

                <label for="sobre">Fale um pouco sobre você: </label>
                <textarea id="sobre" name="sobre" class="form-control" rows="5"></textarea>
                <label for="arquivos">Adicionar arquivos(opcional):</label>
                <input type="file" id="arquivos" name="arquivos" class="form-control" multiple>

                <button type="submit" class="btn btn-danger w-100">
                    Enviar
                </button>
            </form>

            <div id="mensagem-sucesso" class="mensagem-sucesso" hidden>
                <h2>Candidatura enviada!</h2>
                <p>Obrigado pelo seu interesse em fazer parte da nossa equipe.</p>
            </div>

        </div>




    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/script.js"></script>
</body>

</html>
